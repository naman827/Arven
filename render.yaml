# Render Blueprint for the ARVEN AI backend (FastAPI). Values marked sync: false are entered in the
# Render dashboard when the Blueprint is created; they are never stored in this repository.
services:
  - type: web
    name: arven-api
    runtime: python
    # Persistent disks need a paid instance; the free plan wipes the disk (chats, memories, uploads) on every
    # restart or redeploy. 0.5c-512mb is the smallest paid instance type.
    plan: 0.5c-512mb
    rootDir: backend
    # Only data written under mountPath survives deploys and restarts, so DATA_DIR and DATABASE_URL point here.
    disk:
      name: arven-data
      mountPath: /var/data
      sizeGB: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: BACKEND_HOST
        value: 0.0.0.0
      # Public server behind ACCESS_PASSWORD: any Host header is fine (DNS-rebinding protection is for localhost).
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DATA_DIR
        value: /var/data
      # Four slashes: sqlite:/// plus the absolute path /var/data/arven_ai.db
      - key: DATABASE_URL
        value: sqlite:////var/data/arven_ai.db
      # Required, at least 12 characters. The app refuses to start on 0.0.0.0 without it.
      - key: ACCESS_PASSWORD
        sync: false
      # Random secret that signs login tokens; Render generates it once.
      - key: SESSION_SECRET
        generateValue: true
      # Your Netlify site URL, e.g. https://arven-ai.netlify.app (no trailing slash)
      - key: FRONTEND_ORIGIN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3.5-super-vl-120b-a12b
      - key: TAVILY_API_KEY
        sync: false
